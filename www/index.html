<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário Secreto</title>
    <style>
        /* Tema focado em acessibilidade: tons de cinza com excelente contraste */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background: #1a1a1a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #2d2d2d; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 2px solid #444444; }
        h2 { text-align: center; margin-bottom: 20px; color: #ffffff; font-size: 24px; font-weight: bold; }
        p { font-size: 16px; color: #dddddd; line-height: 1.5; }
        
        /* Inputs e Textareas escuros com texto branco nítido e bordas grossas */
        input, textarea { width: 100%; padding: 14px; margin: 12px 0; border-radius: 8px; border: 2px solid #666666; background: #111111; color: #ffffff; font-size: 18px; }
        input:focus, textarea:focus { border-color: #ffffff; outline: none; }
        
        /* Botões de grande contraste */
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #e0e0e0; color: #000000; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #ffffff; }
        .hidden { display: none; }
        
        /* Cards das notas salvas */
        .note-card { background: #383838; padding: 16px; border-radius: 8px; margin-top: 15px; border-left: 6px solid #b0b0b0; border: 1px solid #555555; border-left-width: 6px; }
        .note-date { font-size: 14px; color: #cccccc; font-weight: bold; margin-bottom: 6px; }
        .note-text { font-size: 16px; color: #ffffff; word-break: break-word; }
        
        .btn-lock { background: #ff4d4d; color: #ffffff; margin-top: 25px; }
        .btn-lock:hover { background: #ff6666; }
    </style>
</head>
<body>

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen" class="card">
        <h2 id="auth-title">Criar Nova Senha</h2>
        <p id="auth-desc" style="text-align: center; margin-bottom: 15px;">Defina uma senha forte para proteger o acesso às suas notas privadas.</p>
        <input type="password" id="password-input" placeholder="Digite sua senha aqui...">
        <button onclick="handleAuth()">Confirmar Senha</button>
    </div>

    <!-- PAINEL PRINCIPAL DO DIÁRIO -->
    <div id="app-screen" class="card hidden">
        <h2>Meu Diário Secreto 🔒</h2>
        <textarea id="note-input" rows="4" placeholder="Escreva suas anotações ou pensamentos aqui..."></textarea>
        <button onclick="saveNote()">Salvar Anotação</button>
        
        <div id="notes-container" style="margin-top: 20px; max-height: 300px; overflow-y: auto;"></div>

        <button onclick="lockApp()" class="btn-lock">Bloquear Diário</button>
    </div>

    <script>
        let appPassword = localStorage.getItem('diary_password') || '';
        let notes = JSON.parse(localStorage.getItem('diary_notes')) || [];

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authTitle = document.getElementById('auth-title');
        const authDesc = document.getElementById('auth-desc');

        if (appPassword) {
            authTitle.innerText = "Diário Bloqueado";
            authDesc.innerText = "Insira sua senha secreta para visualizar suas notas.";
        }

        function handleAuth() {
            const input = document.getElementById('password-input').value;
            if (!appPassword) {
                if(input.trim() === "") return alert("Por favor, insira uma senha válida!");
                localStorage.setItem('diary_password', input);
                appPassword = input;
                alert("Senha definida com sucesso!");
                showApp();
            } else {
                if (input === appPassword) {
                    showApp();
                } else {
                    alert("Senha incorreta! Tente novamente.");
                }
            }
            document.getElementById('password-input').value = '';
        }

        function showApp() {
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            renderNotes();
        }

        function lockApp() {
            appScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
            authTitle.innerText = "Diário Bloqueado";
            authDesc.innerText = "Insira sua senha secreta para visualizar suas notas.";
        }

        function saveNote() {
            const text = document.getElementById('note-input').value;
            if(text.trim() === "") return alert("Não é possível salvar uma nota vazia!");

            const now = new Date();
            const dateStr = now.toLocaleDateString('pt-BR') + ' às ' + now.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

            notes.unshift({ text: text, date: dateStr });
            localStorage.setItem('diary_notes', JSON.stringify(notes));
            document.getElementById('note-input').value = '';
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';
            if(notes.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#bbbbbb; font-size:16px; margin-top: 15px;">Nenhuma anotação salva ainda.</p>';
                return;
            }
            notes.forEach(note => {
                const div = document.createElement('div');
                div.className = 'note-card';
                div.innerHTML = `<div class="note-date">${note.date}</div><div class="note-text">${note.text}</div>`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
