
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memórias Secretas</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1a1a1e;
            --card-bg: #26262b;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent-purple: #9333ea;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            background-color: var(--panel-bg);
            border: 1px solid #3f3f46;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Modificado para garantir exibição imediata controlada por JS */
        .screen { display: none; }
        .screen.active { display: block !important; }

        h1 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-top: 0;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="password"], input[type="text"], textarea {
            width: 100%;
            background-color: #09090b;
            border: 1px solid #52525b;
            border-radius: 10px;
            padding: 14px;
            color: #ffffff;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-purple);
        }

        textarea { height: 120px; resize: none; }

        .mood-selector {
            display: flex;
            justify-content: space-between;
            background-color: #09090b;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #3f3f46;
        }

        .mood-btn {
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            width: 50px;
            color: white;
        }

        .mood-btn.selected {
            background-color: var(--accent-purple);
        }

        button {
            width: 100%;
            background-color: var(--accent-purple);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        button.secondary {
            background-color: #27272a;
            border: 1px solid #3f3f46;
            color: var(--text-main);
        }

        button.danger { background-color: var(--danger); }

        .entries-section {
            margin-top: 24px;
            border-top: 1px solid #3f3f46;
            padding-top: 16px;
        }

        .entries-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .entry-list { max-height: 200px; overflow-y: auto; }

        .entry-card {
            background-color: var(--card-bg);
            border: 1px solid #3f3f46;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            text-align: left;
        }

        .entry-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .entry-card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .entry-card-text { font-size: 14px; color: #e4e4e7; }
        
        .del-btn {
            color: var(--danger);
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- TELA 1: Configuração Inicial -->
    <div id="screen-setup" class="screen">
        <h1>Criar Diário Secreto</h1>
        <div class="subtitle">Defina uma senha para proteger seus textos.</div>
        <div class="input-group">
            <label>Nova Senha (Mínimo 4 dígitos)</label>
            <input type="password" id="setup-pin" inputmode="numeric" placeholder="Ex: 1234">
        </div>
        <button onclick="setupPassword()">Ativar Proteção</button>
    </div>

    <!-- TELA 2: Login -->
    <div id="screen-login" class="screen">
        <h1>Diário Bloqueado 🔒</h1>
        <div class="subtitle">Digite sua senha de acesso.</div>
        <div class="input-group">
            <label>Sua Senha</label>
            <input type="password" id="login-pin" inputmode="numeric" placeholder="Senha...">
        </div>
        <button onclick="checkPassword()">Desbloquear</button>
    </div>

    <!-- TELA 3: Painel do Diário -->
    <div id="screen-diary" class="screen">
        <h1>Meu Espaço ✍️</h1>
        <div class="subtitle">Guarde seus pensamentos</div>

        <div class="input-group">
            <label>Humor de hoje</label>
            <div class="mood-selector">
                <button class="mood-btn selected" type="button" onclick="selectMood('😊', this)">😊</button>
                <button class="mood-btn" type="button" onclick="selectMood('😢', this)">😢</button>
                <button class="mood-btn" type="button" onclick="selectMood('😡', this)">😡</button>
                <button class="mood-btn" type="button" onclick="selectMood('🤯', this)">🤯</button>
                <button class="mood-btn" type="button" onclick="selectMood('🥰', this)">🥰</button>
            </div>
        </div>

        <div class="input-group">
            <label>Título</label>
            <input type="text" id="entry-title" placeholder="Título...">
        </div>

        <div class="input-group">
            <label>Relato</label>
            <textarea id="entry-content" placeholder="Escreva aqui..."></textarea>
        </div>

        <button onclick="saveEntry()">Salvar no Diário</button>
        <button class="secondary" onclick="lockDiary()">Trancar Diário 🔑</button>

        <div class="entries-section">
            <div class="entries-header">
                <span>PÁGINAS SALVAS</span>
                <span id="entry-count">0</span>
            </div>
            <div id="entries" class="entry-list"></div>
        </div>

        <div style="margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="secondary" type="button" onclick="exportBackup()">Backup</button>
            <button class="secondary danger" type="button" onclick="destroyDiary()">Apagar Tudo</button>
        </div>
    </div>
</div>

<script>
    let currentMood = '😊';

    function showScreen(screenId) {
        // Remove a classe active de todas as telas com segurança
        const screens = document.querySelectorAll('.screen');
        for (let i = 0; i < screens.length; i++) {
            screens[i].classList.remove('active');
        }
        // Aplica a classe na tela desejada
        const target = document.getElementById(screenId);
        if (target) {
            target.classList.add('active');
        }
    }

    function init() {
        try {
            // Se houver resquícios do banco antigo, limpa para evitar loops de travamento
            if (localStorage.getItem('diary_pin') && !localStorage.getItem('secure_diary_pin')) {
                localStorage.clear();
            }

            if (!localStorage.getItem('secure_diary_pin')) {
                showScreen('screen-setup');
            } else {
                showScreen('screen-login');
            }
        } catch (e) {
            // Fallback de segurança: se algo der erro na leitura, força a tela de setup
            showScreen('screen-setup');
        }
    }

    function setupPassword() {
        const pin = document.getElementById('setup-pin').value;
        if (pin.trim().length < 4) {
            alert('Escolha uma senha de pelo menos 4 caracteres.');
            return;
        }
        localStorage.setItem('secure_diary_pin', btoa(pin));
        localStorage.setItem('secure_diary_data', JSON.stringify([]));
        showScreen('screen-diary');
        loadEntries();
    }

    function checkPassword() {
        const inputPin = document.getElementById('login-pin').value;
        const savedPin = atob(localStorage.getItem('secure_diary_pin'));
        
        if (inputPin === savedPin) {
            showScreen('screen-diary');
            loadEntries();
            document.getElementById('login-pin').value = '';
        } else {
            alert('Senha incorreta!');
        }
    }

    function selectMood(mood, element) {
        currentMood = mood;
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
        element.classList.add('selected');
    }

    function saveEntry() {
