
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memórias Secretas</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060409 100%);
            --panel-bg: rgba(25, 20, 40, 0.65);
            --card-bg: rgba(35, 30, 60, 0.5);
            --border-glow: rgba(142, 68, 173, 0.3);
            --text-main: #ffffff;
            --text-muted: #a29bfe;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .screen { display: none; animation: fadeIn 0.4s ease-out; }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-top: 0;
            margin-bottom: 8px;
            background: linear-gradient(to right, var(--text-main), var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        /* Inputs Modernos */
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="password"], input[type="text"], textarea, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        textarea {
            height: 150px;
            resize: none;
            line-height: 1.5;
        }

        /* Grid de Emojis de Humor */
        .mood-selector {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .mood-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.2s;
            width: auto;
        }

        .mood-btn.selected {
            background: var(--accent-purple);
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(168, 85, 247, 0.4);
        }

        /* Botões Estilizados */
        button {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple) 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            margin-bottom: 12px;
        }

        button:active { transform: scale(0.98); }

        button.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            box-shadow: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        button.danger {
            background: linear-gradient(135deg, var(--danger) 0%, #b91c1c 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        /* Lista de Histórico */
        .entries-section {
            margin-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .entries-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .entry-list {
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .entry-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: left;
            transition: transform 0.2s;
        }

        .entry-card:active { transform: scale(0.99); }

        .entry-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .entry-card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .entry-card-text {
            font-size: 14px;
            color: #d1d5db;
            white-space: pre-wrap;
        }

        .entry-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            gap: 12px;
        }

        .action-link {
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: none;
        }
        .action-link.del { color: var(--danger); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- TELA 1: Configuração Inicial -->
    <div id="screen-setup" class="screen">
        <h1>Criar Diário Criptografado</h1>
        <div class="subtitle">Defina uma senha de acesso para proteger sua privacidade.</div>
        <div class="input-group">
            <label>Nova Senha (Mínimo 4 dígitos)</label>
            <input type="password" id="setup-pin" inputmode="numeric" pattern="[0-9]*" placeholder="Ex: 1234">
        </div>
        <button onclick="setupPassword()">Ativar Proteção Secreta</button>
    </div>

    <!-- TELA 2: Login -->
    <div id="screen-login" class="screen">
        <h1>Diário Bloqueado 🔒</h1>
        <div class="subtitle">Insira suas credenciais para descriptografar os dados.</div>
        <div class="input-group">
            <label>Sua Senha</label>
            <input type="password" id="login-pin" inputmode="numeric" placeholder="Digite aqui...">
        </div>
        <button onclick="checkPassword()">Desbloquear Espaço</button>
    </div>

    <!-- TELA 3: Painel do Diário -->
    <div id="screen-diary" class="screen">
        <h1>Meu Espaço Secreto ✍️</h1>
        <div class="subtitle" id="diary-welcome">Pronto para guardar novas memórias</div>

        <div class="input-group">
            <label>Como você está se sentindo hoje?</label>
            <div class="mood-selector">
                <button class="mood-btn selected" onclick="selectMood('😊', this)">😊</button>
                <button class="mood-btn" onclick="selectMood('😢', this)">😢</button>
                <button class="mood-btn" onclick="selectMood('😡', this)">😡</button>
                <button class="mood-btn" onclick="selectMood('🤯', this)">🤯</button>
                <button class="mood-btn" onclick="selectMood('🥰', this)">🥰</button>
            </div>
        </div>

        <div class="input-group">
            <label>Título do Relato</label>
            <input type="text" id="entry-title" placeholder="Um título para este momento...">
        </div>

        <div class="input-group">
            <label>O que está acontecendo?</label>
            <textarea id="entry-content" placeholder="Querido diário, hoje..."></textarea>
        </div>

        <button onclick="saveEntry()">Garantir Registro Permanente</button>
        <button class="secondary" onclick="lockDiary()">Trancar Diário Agora 🔑</button>

        <!-- Seção de Histórico Refinada -->
        <div class="entries-section">
            <div class="entries-header">
                <span style="font-weight: 600; font-size: 14px; color: var(--text-muted);">PÁGINAS SALVAS</span>
                <span id="entry-count" style="font-size: 12px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 20px;">0</span>
            </div>
            <div id="entries" class="entry-list"></div>
        </div>

        <!-- Ferramentas Extras de App Premium -->
